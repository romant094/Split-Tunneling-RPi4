# /etc/dnsmasq.conf — RPi VPN Gateway dnsmasq configuration
#
# Deployed to /etc/dnsmasq.conf on the RPi by deploy.sh (Phase 4 stage).
#
# Manual Keenetic step (required for LAN devices to use this resolver):
#   Navigate to 192.168.1.1 → Home network → Segments → DNS server
#   Set DNS server to 192.168.1.254 (the RPi's LAN IP)
#   This routes all LAN device DNS queries through the RPi dnsmasq forwarder.
#
# Decisions honored: D-06 (forwarding-only resolver), D-07 (Cloudflare upstream 1.1.1.1),
# D-08 (log-queries → journald), D-09 (listen on eth0 only), D-10 (journald retention).

# Listen on the LAN-facing interface only (D-09).
# Do NOT listen on awg0 (VPN tunnel) or lo (loopback).
interface=eth0

# Do not read /etc/resolv.conf — fully controlled upstream list below.
# Prevents the system resolver from interfering with dnsmasq's upstream selection.
no-resolv

# Upstream DNS resolver (D-07): Cloudflare 1.1.1.1.
# Queries egress through awg0 (default VPN route), so DNS traffic is tunneled through VPN.
server=1.1.1.1

# Do not forward bare hostnames (no dot) to upstream — prevents local hostname leakage.
domain-needed

# Do not forward reverse lookups for RFC1918 ranges (192.168.x.x, 10.x.x.x, 172.16-31.x.x)
# to upstream DNS — these have no valid answer upstream and waste queries.
bogus-priv

# Log every DNS query/response to syslog → journald (D-08).
# Enables vpn-status.sh to correlate destination IPs with domain names.
# View with: journalctl -u dnsmasq -f
log-queries

# Route dnsmasq log messages through the daemon syslog facility.
# journald captures these under the dnsmasq.service unit.
log-facility=daemon
